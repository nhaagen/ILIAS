<div popover id="{ID}" anchor="--anchor_{ID}" class="c-popover" role="tooltip">

	<div class="c-popover__arrow"></div>

	<div class="c-popover__inner">
		<div class="c-popover__title">
			<span>{TITLE}</span>
		</div>
		<div class="c-popover__content" id="content_{ID}">
			<div data-replace-marker="content">
				{CONTENT}
			</div>
		</div>
	</div>

</div>
